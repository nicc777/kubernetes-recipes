---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dummy-cm
  namespace: bootstrapping
data:
  test.data: tasks are my jam

# ################################################################################
# 
#           PIPELINE 
#
# ################################################################################


---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bootstrap-k3s-pipeline
  namespace: bootstrapping
spec:
  workspaces:
  - name: ws-env
  - name: shared-data
  tasks:
  - name: run-prepare-helm-executable
    taskRef:
      name: prepare-helm-executable
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-nfs-task
    runAfter:
    - run-prepare-helm-executable
    taskRef:
      name: nfs-task
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-nginx-gateway-fabric-task
    runAfter:
    - run-nfs-task
    taskRef:
      name: nginx-gateway-fabric-task
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-install-cert-manager-task
    runAfter:
    - run-nginx-gateway-fabric-task
    taskRef:
      name: install-cert-manager-task
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-certificate-generation
    runAfter:
    - run-install-cert-manager-task
    taskRef:
      name: certificate-generation
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-deploy-primary-gateway
    runAfter:
    - run-certificate-generation
    taskRef:
      name: deploy-primary-gateway
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-end-task
    runAfter:
    - run-deploy-primary-gateway
    taskRef:
      name: end-task
    workspaces:
    - name: ws-env
    - name: shared-data
---
#apiVersion: tekton.dev/v1
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: bootstrap-run
  namespace: bootstrapping
spec:
  serviceAccountName: tekton-cluster-admin-sa
  pipelineRef:
    name: bootstrap-k3s-pipeline
  workspaces:
  - name: shared-data
    persistentVolumeClaim:
      claimName: shared-task-storage
  - name: ws-env
    secret:
      secretName: env-secret
