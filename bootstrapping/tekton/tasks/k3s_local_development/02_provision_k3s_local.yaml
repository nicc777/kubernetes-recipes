---
# Using a local filesystem as per K3s example:
# https://docs.k3s.io/storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-task-storage
  namespace: bootstrapping
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-helm-executable
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: check-helm
    image: debian:bookworm
    script: |
      #!/usr/bin/env bash
      export XDG_CACHE_HOME=$(workspaces.shared-data.path)/.helm_cache
      export HELM_CONFIG_HOME=$XDG_CACHE_HOME
      mkdir -p $XDG_CACHE_HOME || true
      chmod 777 $XDG_CACHE_HOME
      FILE=$(workspaces.shared-data.path)/helm
      if [ -f "$FILE" ]; then
        echo "Helm Executable is available..."
      else
        apt update && apt install -y wget
        wget https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz
        tar xzf helm-v3.17.4-linux-amd64.tar.gz
        mv -vf linux-amd64/helm $(workspaces.shared-data.path)/helm
        echo "Helm installed"
      fi
      $FILE version
      count=$($FILE version | grep version | wc -l)
      if [ "$count" -eq 0 ]; then
        echo "Error: Seems helm somehow failed to install" >&2
        exit 1
      fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nfs-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: prepare-values
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      echo "Creating values file..."
      export NFS_SERVER=$(head -n 1 $(workspaces.ws-env.path)/NFS_SERVER)
      export NFS_PATH=$(head -n 1 $(workspaces.ws-env.path)/NFS_PATH)
      cat <<EOF > $(workspaces.shared-data.path)/nfs-values.yaml
      nfs:
        server: ${NFS_SERVER}
        path: ${NFS_PATH}
        mountOptions:
        - nfsvers=4
      EOF
      ls -lahrt $(workspaces.shared-data.path)/nfs-values.yaml
      echo
      echo "----------------------------------------"
      cat $(workspaces.shared-data.path)/nfs-values.yaml
      echo
      echo "----------------------------------------"
      # DONE
  - name: validate-current-storage-classes
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      count=$(kubectl get storageclasses | grep -v NAME | grep nfs | wc -l)
      if [ "$count" -eq 0 ]; then
        touch $(workspaces.shared-data.path)/do_nfs_install
      fi
  - name: install-nfs
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      export XDG_CACHE_HOME=$(workspaces.shared-data.path)/.helm_cache
      export HELM_CONFIG_HOME=$XDG_CACHE_HOME
      FILE="$(workspaces.shared-data.path)/do_nfs_install"
      export HELM=$(workspaces.shared-data.path)/helm
      echo "----------------------------------------"
      ls -lahrt $XDG_CACHE_HOME/
      echo "----------------------------------------"
      ls -lahrt $(workspaces.shared-data.path)/
      echo "----------------------------------------"
      env
      echo "----------------------------------------"
      if [ -f "$FILE" ]; then
        $HELM repo add nfs-subdir-external-provisioner https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        $HELM repo update
        $HELM install nfs nfs-subdir-external-provisioner/nfs-subdir-external-provisioner -f $(workspaces.shared-data.path)/nfs-values.yaml
        echo "Sleeping 30 seconds to allow the StorageClass to be created..."
        sleep 30
      else
        echo "The NFS Storage class may already be installed. Skipping installation."
      fi
      echo "Installation of the NFS StorageClass Completed"
  - name: validate-nfs-storageclass-is-available
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      kubectl get storageclasses
      loop_count=0
      MAX_ITERATIONS=10
      SUCCEEDED=0
      while [ "$loop_count" -lt "$MAX_ITERATIONS" ]; do
        sleep 10
        ((loop_count++))
        echo "Validation iteration #${loop_count}..."
        count=$(kubectl get storageclasses | grep -v NAME | grep nfs |  wc -l)
        if [ "$count" -eq 1 ]; then
          SUCCEEDED=1
          loop_count=9999
        fi
      done
      if [ "$SUCCEEDED" -eq 0 ]; then
        echo "Error: Seems the NFS StorageClass somehow failed to install" >&2
        exit 1
      fi
      echo "NFS Storage Class Installed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nginx-gateway-fabric-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: install-ngf-required-crds
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      kubectl kustomize "https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v1.6.2" | kubectl apply -f -
  - name: prepare-values
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      cat <<EOF > $(workspaces.shared-data.path)/ngf-values.yaml
      nginx:
        service:
          type: NodePort
          nodePorts:
          - port: 30080
            listenerPort: 80
          - port: 30443
            listenerPort: 443
      EOF
  - name: install-ngf
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      export XDG_CACHE_HOME=$(workspaces.shared-data.path)/.helm_cache
      ls -lahrt $(workspaces.shared-data.path)/
      export HELM=$(workspaces.shared-data.path)/helm
      $HELM install ngf oci://ghcr.io/nginx/charts/nginx-gateway-fabric --create-namespace -n nginx-gateway -f $(workspaces.shared-data.path)/ngf-values.yaml
      loop_count=0
      MAX_ITERATIONS=10
      SUCCEEDED=0
      while [ "$loop_count" -lt "$MAX_ITERATIONS" ]; do
        sleep 10
        ((loop_count++))
        echo "Validation iteration #${loop_count}..."
        # We just need at least ONE pod running
        count=$(kubectl get pods -n nginx-gateway | grep ngf-nginx-gateway-fabric | grep Running | head -1 | wc -l)
        if [ "$count" -eq 1 ]; then
          SUCCEEDED=1
          loop_count=9999
        fi
      done
      if [ "$SUCCEEDED" -eq 0 ]; then
        echo "Error: Seems the Nginx Gateway Farbic somehow failed to install" >&2
        exit 1
      fi
      echo "Installation of the Nginx Gateway Fabric Completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-cert-manager-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: prepare-cert-manager-manifest
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      cat <<EOF > $(workspaces.shared-data.path)/k3s_cert_manager.yaml
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: cert-manager
        namespace: kube-system
      spec:
        chart: oci://quay.io/jetstack/charts/cert-manager
        version: v1.18.2
        targetNamespace: cert-manager
        createNamespace: true
        valuesContent: |-
          crds:
            enabled: true
      EOF
  - name: install-cert-manager
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      kubectl apply -f $(workspaces.shared-data.path)/k3s_cert_manager.yaml
  - name: validate-cert-manager-installation
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      sleep 60
      loop_count=0
      MAX_ITERATIONS=10
      SUCCEEDED=0
      while [ "$loop_count" -lt "$MAX_ITERATIONS" ]; do
        sleep 10
        ((loop_count++))
        echo "Validation iteration #${loop_count}..."
        # We just need at least ONE pod running
        count=$(kubectl get pods -n cert-manager | grep -v NAME | egrep -v "NAME|cainjector|webhook" | grep "cert-manager-" | grep Running | head -1 | wc -l)
        if [ "$count" -eq 1 ]; then
          SUCCEEDED=1
          loop_count=9999
        fi
      done
      if [ "$SUCCEEDED" -eq 0 ]; then
        kubectl get pods -n cert-manager
        echo "Error: Seems cert-manager somehow failed to install" >&2
        exit 1
      fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: certificate-generation
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: prepare-manifests-for-certificate-generation
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      export ID=$(head -n 1 $(workspaces.ws-env.path)/ROUTE_53_RESOURCE_ID)
      export DOMAIN=$(head -n 1 $(workspaces.ws-env.path)/ROUTE_53_DOMAIN)
      export SECRET_NAME="${ID}-route53-creds-secret"
      export CLUSTER_ISSUER_NAME="letsencrypt-${ID}"
      export ISSUER_ACCOUNT_KEY_NAME="${ID}-issuer-account-key"
      export ACCESS_KEY=$(head -1 $(workspaces.ws-env.path)/LE_R53_KEY)
      export SECRET_KEY=$(head -1 $(workspaces.ws-env.path)/LE_R53_SECRET)
      export EMAIL=$(head -1 $(workspaces.ws-env.path)/EMAIL)
      export DNS_NAME_1=$DOMAIN
      export DNS_NAME_2="*.${DOMAIN}"
      cat <<EOF > $(workspaces.shared-data.path)/k3s_certificates.yaml
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: $SECRET_NAME
        namespace: cert-manager
      type: Opaque
      stringData:
        access-key-id: $ACCESS_KEY
        secret-access-key: $SECRET_KEY
      ---
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: $CLUSTER_ISSUER_NAME
        namespace: cert-manager
      spec:
        acme:
          email: $EMAIL
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: $ISSUER_ACCOUNT_KEY_NAME
          solvers:
          - dns01:
              route53:
                region: eu-central-1
                accessKeyIDSecretRef:
                  name: $SECRET_NAME
                  key: access-key-id
                secretAccessKeySecretRef:
                  name: $SECRET_NAME
                  key: secret-access-key
      ---
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-${ID}-certificate
        namespace: nginx-gateway
      spec:
        secretName: wildcard-${ID}-tls-secret
        issuerRef:
          name: letsencrypt-${ID}
          kind: ClusterIssuer
          group: cert-manager.io
        dnsNames:
          - "$DNS_NAME_1"
          - "$DNS_NAME_2"
      EOF
      echo "----------------------------------------"
      cat $(workspaces.shared-data.path)/k3s_certificates.yaml
      echo "----------------------------------------"
  - name: apply-certificate-manifest
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      kubectl apply -f $(workspaces.shared-data.path)/k3s_certificates.yaml
      echo "Waiting for certificate to be in a ready state... (maximum 10 minutes approx.)" 
      loop_count=0
      MAX_ITERATIONS=60
      SUCCEEDED=0
      while [ "$loop_count" -lt "$MAX_ITERATIONS" ]; do
        sleep 10
        ((loop_count++))
        echo "Validation iteration #${loop_count}..."
        # The certificate must get to a True status...
        count=$(kubectl get certificates -n nginx-gateway 2>/dev/null | grep -v NAME | grep "wildcard-" | grep "True" | wc -l)
        if [ "$count" -eq 1 ]; then
          SUCCEEDED=1
          loop_count=9999
        fi
      done
      if [ "$SUCCEEDED" -eq 0 ]; then
        kubectl get pods -n cert-manager
        echo "Error: Seems cert-manager somehow failed to install" >&2
        exit 1
      fi

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-primary-gateway
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: prepare-manifest
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      export ID=$(head -n 1 $(workspaces.ws-env.path)/ROUTE_53_RESOURCE_ID)
      cat <<EOF > $(workspaces.shared-data.path)/k3s_gateway.yaml
      ---
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: private-gateway
        namespace: nginx-gateway
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-$ID
      spec:
        gatewayClassName: nginx
        listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  shared-gateway-access: "true"
        - name: https
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
            - kind: Secret
              group: ""
              name: wildcard-${ID}-tls-secret
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  shared-gateway-access: "true"
      EOF
      echo "----------------------------------------"
      cat $(workspaces.shared-data.path)/k3s_gateway.yaml
      echo "----------------------------------------"
  - name: apply-gateway-manifest
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      kubectl apply -f $(workspaces.shared-data.path)/k3s_gateway.yaml
      echo "----------------------------------------"
      sleep 10  
      kubectl get gateways -n nginx-gateway
      echo "----------------------------------------"
      sleep 10
      kubectl describe gateway/private-gateway -n nginx-gateway

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: end-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: print-done-message
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      echo "Created Files:"
      echo "-------------"
      echo
      ls -lahrt $(workspaces.shared-data.path)/*.yaml
      echo
      echo
      echo "DONE !!!"

