---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitea-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: prepare-values
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      echo "See https://gitea.com/gitea/helm-gitea for details..."
      export NFS_SERVER=$(head -n 1 $(workspaces.ws-env.path)/NFS_SERVER)
      export NFS_PATH=$(head -n 1 $(workspaces.ws-env.path)/NFS_PATH)
      cat <<EOF > $(workspaces.shared-data.path)/gitea_volumes.yaml
      ---
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: nfs-gitea-pv
        namespace: devops
      spec:
        capacity:
          storage: 10Gi
        volumeMode: Filesystem
        accessModes:
        - ReadWriteMany
        persistentVolumeReclaimPolicy: Retain
        storageClassName: nfs-gitea-data
        nfs:
          path: ${NFS_PATH}/gitea-main
          server: ${NFS_SERVER}
      ---
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: nfs-gitea-pvc
        namespace: devops
      spec:
        accessModes:
        - ReadWriteMany
        storageClassName: nfs-gitea-data
        resources:
          requests:
            storage: 10Gi
      EOF

      cat <<EOF > $(workspaces.shared-data.path)/gitea_db.yaml
      ---
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: nfs-gitea-db-pv
        namespace: devops
      spec:
        capacity:
          storage: 15Gi
        volumeMode: Filesystem
        accessModes:
        - ReadWriteMany
        persistentVolumeReclaimPolicy: Retain
        storageClassName: nfs-gitea-db
        nfs:
          The following directory needs to exist on NFS:
          path: ${NFS_PATH}/gitea-sb
          server: ${NFS_SERVER}
      ---
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: nfs-gitea-db-pvc
        namespace: devops
      spec:
        accessModes:
        - ReadWriteMany
        storageClassName: nfs-gitea-db
        resources:
          requests:
            storage: 15Gi
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgres-db-init
        namespace: devops
      data:
        init-gitea.sh: |
          #!/usr/bin/env bash
          set -e
          psql -v ON_ERROR_STOP=1 --username "\$POSTGRES_USER" --dbname "\$POSTGRES_DB" <<-EOSQL
            CREATE USER gitea WITH LOGIN PASSWORD 'gitea-password';
            CREATE DATABASE gitea WITH OWNER gitea TEMPLATE template0 ENCODING UTF8 LC_COLLATE 'en_US.UTF-8' LC_CTYPE 'en_US.UTF-8';
            GRANT ALL PRIVILEGES ON DATABASE gitea TO gitea;
          EOSQL
          # See https://hub.docker.com/_/postgres#initialization-scripts
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: gitea-postgres
        namespace: devops
        labels:
          app: gitea
      spec:
        ports:
        - port: 5432
          name: postgres
        selector:
          app: gitea-postgres
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: gitea-postgres
        namespace: devops
      spec:
        selector:
          matchLabels:
            app: gitea-postgres
        serviceName: gitea-postgres
        replicas: 1
        minReadySeconds: 10
        template:
          metadata:
            labels:
              app: gitea-postgres
          spec:
            terminationGracePeriodSeconds: 10
            containers:
            - name: gitea-postgres
              image: docker.io/postgres:17.6-bookworm
              env:
              - name: POSTGRES_PASSWORD
                value: password
              ports:
              - containerPort: 5432
                name: postgres
              volumeMounts:
              - name: postgres-data
                mountPath: /var/lib/postgresql/data
              - name: postgres-db-init-script
                mountPath: /docker-entrypoint-initdb.d
            volumes:
            - name: postgres-data
              persistentVolumeClaim:
                claimName: nfs-gitea-db-pvc
            - name: postgres-db-init-script
              configMap:
                name: postgres-db-init
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pgadmin-servers
        namespace: devops
      data:
        servers.json: |
          {
            "Servers": {
              "1": {
                "Name": "Gitea DB",
                "Group": "Gitea",
                "Port": 5432,
                "Username": "postgres",
                "Host": "gitea-postgres",
                "MaintenanceDB": "postgres",
                "ConnectionParameters": {
                    "connect_timeout": 10
                }
              }
            }
          }
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pgadmin-deployment
        namespace: devops
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: pgadmin
        template:
          metadata:
            labels:
              app: pgadmin
          spec:
            containers:
            - name: pgadmin
              image: docker.io/dpage/pgadmin4:9.6.0
              ports:
              - containerPort: 80
              env:
              - name: PGADMIN_DEFAULT_EMAIL
                value: admin@example.com
              - name: PGADMIN_DEFAULT_PASSWORD
                value: admin
              - name: PGADMIN_SERVER_JSON_FILE
                value: /data/extras/servers.json
              volumeMounts:
              - name: pgadmin-servers-volume
                mountPath: /data/extras
            volumes:
            - name: pgadmin-servers-volume
              configMap:
                name: pgadmin-servers
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: pgadmin-service
        namespace: devops
      spec:
        selector:
          app: pgadmin
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80

      EOF

      cat <<EOF > $(workspaces.shared-data.path)/gitea_values.yaml
      namespace: devops
      replicaCount: 1
      ingress:
        enabled: false
      persistence:
        create: false
        claimName: nfs-gitea-pvc
      gitea:
        config:
          database:
            DB_TYPE: postgres
            HOST: "gitea-postgres:5432"
            NAME: gitea
            USER: gitea
            PASSWD: gitea-password
        admin:
          username: gitea
          password: gitea-password
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      valkey-cluster:
        enabled: false
      valkey:
        enabled: true
      postgresql-ha:
        enabled: false
      postgresql:
        enabled: false
      service:
        ssh:
          type: NodePort
          nodePort: 30022
      EOF
  - name: install-gitea-helm-chart
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      export XDG_CACHE_HOME=$(workspaces.shared-data.path)/.helm_cache
      export HELM_CONFIG_HOME=$XDG_CACHE_HOME
      export HELM=$(workspaces.shared-data.path)/helm
      echo "----------------------------------------"
      echo "Cleanup Previous Artifacts..."
      echo
      $HELM uninstall -n devops gitea || true
      kubectl delete -f $(workspaces.shared-data.path)/gitea_db.yaml
      kubectl delete -f $(workspaces.shared-data.path)/gitea_volumes.yaml
      kubectl delete pvc/nfs-gitea-pvc -n devops
      kubectl delete pvc/valkey-data-gitea-valkey-primary-0 -n devops
      kubectl delete namespace devops
      echo "----------------------------------------"
      echo "Installing Postgres and PGAdmin..."
      echo
      sleep 3
      kubectl create namespace devops || true
      kubectl apply -f $(workspaces.shared-data.path)/gitea_volumes.yaml
      kubectl apply -f $(workspaces.shared-data.path)/gitea_db.yaml
      echo "----------------------------------------"
      echo "Taking a nap for a minute"
      echo
      sleep 60
      echo "----------------------------------------"
      echo "Installing Gitea via Helm"
      echo
      # Install Gitea
      $HELM install gitea oci://registry-1.docker.io/giteacharts/gitea -n devops -f $(workspaces.shared-data.path)/gitea_values.yaml


---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: end-task
  namespace: bootstrapping
spec:
  workspaces:
  - name: shared-data
    mountPath: /data/general
  - name: ws-env
    mountPath: /data/.env
  steps:
  - name: print-done-message
    image: bitnami/kubectl:latest
    script: |
      #!/usr/bin/env bash
      echo "----------------------------------------"
      echo "Created Files:"
      echo "----------------------------------------"
      echo
      ls -lahrt $(workspaces.shared-data.path)/*.yaml
      echo
      echo "----------------------------------------"
      echo "Namespaces:"
      echo "----------------------------------------"
      echo
      kubectl get namespaces
      echo
      echo "----------------------------------------"
      echo "Helm Charts Installed:"
      echo "----------------------------------------"
      echo
      export XDG_CACHE_HOME=$(workspaces.shared-data.path)/.helm_cache
      export HELM_CONFIG_HOME=$XDG_CACHE_HOME
      export HELM=$(workspaces.shared-data.path)/helm
      $HELM list --all-namespaces
      echo
      echo "----------------------------------------"
      echo
      echo "DONE !!!"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bootstrap-k3s-pipeline-tmp
  namespace: bootstrapping
spec:
  workspaces:
  - name: ws-env
  - name: shared-data
  tasks:
  - name: run-gitea-task
    taskRef:
      name: gitea-task
    workspaces:
    - name: ws-env
    - name: shared-data
  - name: run-end-task
    runAfter:
    - run-gitea-task
    taskRef:
      name: end-task
    workspaces:
    - name: ws-env
    - name: shared-data
---
#apiVersion: tekton.dev/v1
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: bootstrap-run-tmp
  namespace: bootstrapping
spec:
  serviceAccountName: tekton-cluster-admin-sa
  pipelineRef:
    name: bootstrap-k3s-pipeline-tmp
  workspaces:
  - name: shared-data
    persistentVolumeClaim:
      claimName: shared-task-storage
  - name: ws-env
    secret:
      secretName: env-secret
