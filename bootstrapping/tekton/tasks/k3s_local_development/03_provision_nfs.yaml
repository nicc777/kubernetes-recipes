---
# Using a local filesystem as per K3s example:
# https://docs.k3s.io/storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bs-nfs-install
  namespace: bootstrapping
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  namespace: bootstrapping
  name: provision-nfs
spec:
  serviceAccountName: tekton-cluster-admin-sa
  workspaces:
    - name: ws-storeage
      persistentVolumeClaim:
        claimName: bs-nfs-install
    - name: ws-env
      secret:
        secretName: env-secret
  taskSpec:
    workspaces:
    - name: ws-storeage
      mountPath: /data/general
    - name: ws-env
      mountPath: /data/.env
    steps:
    - name: create-nfs-manifest
      image: bitnami/kubectl:latest
      script: |
        #!/usr/bin/env bash
        export NFS_SERVER=`cat $(workspaces.ws-env.path)/NFS_SERVER`
        export NFS_PATH=`cat $(workspaces.ws-env.path)/NFS_PATH`
        cat <<EOF > $(workspaces.ws-storeage.path)/k3s_nfs.yaml
        apiVersion: helm.cattle.io/v1
        kind: HelmChart
        metadata:
          name: nfs
          namespace: default
        spec:
          chart: nfs-subdir-external-provisioner
          repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
          targetNamespace: default
          set:
            storageClass.name: nfs
          valuesContent: |-
            nfs:
                server: ${NFS_SERVER}
                path: ${NFS_PATH}
                mountOptions:
                - nfsvers=4
        EOF
    - name: apply-nfs-manifest
      image: bitnami/kubectl:latest
      script: |
        #!/usr/bin/env bash
        cat $(workspaces.ws-storeage.path)/k3s_nfs.yaml
        kubectl apply -f $(workspaces.ws-storeage.path)/k3s_nfs.yaml
        sleep 60
        kubectl get storageclasses
