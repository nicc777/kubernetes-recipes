---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-validating-webhook
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-validating-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-mutating-webhook
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}-mutating-webhook
