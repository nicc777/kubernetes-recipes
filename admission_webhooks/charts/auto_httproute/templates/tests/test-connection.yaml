apiVersion: v1
kind: Pod
metadata:
  name: {{ .Chart.Name }}-webhook-test
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "auto_httproute.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
