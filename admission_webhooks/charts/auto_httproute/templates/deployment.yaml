---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validating-webhook
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validating-webhook
  template:
    metadata:
      labels:
        app: validating-webhook
    spec:
      replicas: {{ .Values.replicaCount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.validationWebhook.repository }}:{{ .Values.image.validationWebhook.tag }}"
          imagePullPolicy: {{ .Values.image.validationWebhook.pullPolicy }}
          ports:
          - name: http
            containerPort: {{ .Values.service.port }}
            protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ if eq .Values.service.tlsEnabled "1" }}
          volumeMounts:
          - name: tls
            mountPath: /certs
            readOnly: true
          {{ end }}
          env:
          {{- with .Values.service }}
          - name: SSL_CERTIFICATE_FILE
            value: {{ .tlsCertificateFile }}
          - name: SSL_KEY_FILE
            value: {{ .tlsKeyFile }}
          - name: USE_TL
            value: {{ .tlsEnabled | quote }}
          {{- end }}
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: {{ .Values.service.port | quote }}
          - name: WORKERS
            value: {{ .Values.service.workers | quote }}
      {{ if eq .Values.service.tlsEnabled "1" }}
      volumes:
      - name: tls
        secret:
          secretName: webhook-tls
      {{ end }}
      # nodeSelector:
      #   {{- toYaml . | nindent 8 }}
      # {{- with .Values.affinity }}
      # affinity:
      #   {{- toYaml . | nindent 8 }}
      # {{- end }}
      # {{- with .Values.tolerations }}
      # tolerations:
      #   {{- toYaml . | nindent 8 }}
      # {{- end }}

