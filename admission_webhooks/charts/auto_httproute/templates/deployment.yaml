---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-validating-webhook
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-validating-webhook
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-validating-webhook
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-validating-webhook
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.validationWebhook.repository }}:{{ .Values.image.validationWebhook.tag }}"
          imagePullPolicy: {{ .Values.image.validationWebhook.pullPolicy }}
          ports:
          - name: http
            containerPort: {{ .Values.service.port }}
            protocol: TCP
          {{- with .Values.livenessProbe.webhooks }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe.webhooks }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt ( int .Values.applicationSettings.webhooks.tlsEnabled ) 0 }}
            {{- with .Values.tlsVolumeMounts }}
              {{- toYaml . | nindent 10 }}
            {{- end }}
          {{- end }}
          env:
          {{- with .Values.applicationSettings.webhooks }}
          - name: SSL_CERTIFICATE_FILE
            value: {{ .tlsCertificateFile }}
          - name: SSL_KEY_FILE
            value: {{ .tlsKeyFile }}
          - name: USE_TLS
            value: {{ .tlsEnabled | quote }}
          {{- end }}
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: {{ .Values.service.port | quote }}
          - name: WORKERS
            value: {{ .Values.applicationSettings.webhooks.workers | quote }}
          - name: DEBUG
            value: {{ .Values.applicationSettings.webhooks.debug | quote }}
      {{- if gt ( int .Values.applicationSettings.webhooks.tlsEnabled ) 0 }}
        {{- with .Values.tlsVolumes }}
          {{- toYaml . | nindent 6 }}
        {{- end }}
      {{- end }}

