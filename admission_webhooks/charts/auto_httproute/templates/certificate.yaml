---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: webhook-issuer
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-cert
  namespace: {{ .Values.namespace }}
spec:
  secretName: webhook-tls
  issuerRef:
    name: webhook-issuer
    kind: Issuer
  commonName: webhook.{{ .Values.namespace }}.svc
  dnsNames:
    - webhook.{{ .Values.namespace }}.svc
    - webhook.{{ .Values.namespace }}.svc.cluster.local
  usages:
    - server auth


