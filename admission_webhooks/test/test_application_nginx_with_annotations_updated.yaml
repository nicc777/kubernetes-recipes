---
apiVersion: v1
kind: Namespace
metadata:
  name: test-app
  labels:
    name: test-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: test-app
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: test-app
  annotations:
    auto-httproute/expose-public: "true"
    auto-httproute/public-record-name: test-app
    auto-httproute/service-target-port: "80"
    auto-httproute/gateway-name: private-gateway
    auto-httproute/gateway-http-section-name: http
    auto-httproute/gateway-https-section-name: https
    auto-httproute/domain-name: example.com
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
